<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sovico Group — Data Platform Connectivity Map (AS-IS)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#0000FF; --blue-deep:#0000F5; --magenta:#CF2C91;
  --ink:#1F2733; --muted:#5B6478; --faint:#8A93A6;
  --hair:#D6DCE7; --hair-soft:#E7ECF4;
  --surface:#FFFFFF; --tint:#F3F6FF; --shell:#F6F8FC;
  --orange:#E4803A; --teal:#55B497; --pink:#BE3C8E; --gray:#9AA6B8;
  --font:'Montserrat','Helvetica Neue',Helvetica,Arial,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0; font-family:var(--font); color:var(--ink);
  background:var(--shell); overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* ============================ HEADER ============================ */
.head{
  position:relative; z-index:30; background:var(--surface);
  border-bottom:1px solid var(--hair);
  padding:18px 28px 16px; display:flex; align-items:flex-start; gap:32px;
}
.head-main{flex:1; min-width:0}
.eyebrow{
  font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:var(--muted); margin:0 0 6px;
}
.head h1{font-size:22px; font-weight:800; color:var(--blue); margin:0; letter-spacing:-.01em}
.rule{width:56px; height:3px; background:var(--magenta); margin:9px 0 8px; border-radius:2px}
.head p{margin:0; font-size:13px; color:var(--muted); max-width:760px; line-height:1.5}

.head-side{display:flex; align-items:center; gap:22px; flex-shrink:0}
.state-badge{
  display:flex; flex-direction:column; align-items:flex-end; gap:3px;
}
.state-badge b{
  font-size:12px; font-weight:800; letter-spacing:.14em; color:var(--surface);
  background:var(--ink); padding:4px 11px; border-radius:4px;
}
.state-badge span{font-size:11px; color:var(--faint)}
.galaxy-logo{height:34px; width:auto; display:block}

/* ============================ TOOLBAR ============================ */
.bar{
  position:relative; z-index:20; display:flex; align-items:center; gap:18px;
  padding:9px 28px; background:var(--surface);
  border-bottom:1px solid var(--hair); flex-wrap:wrap;
}
.zoom{display:flex; align-items:center; gap:5px}
.btn{
  font-family:var(--font); font-size:12px; font-weight:600; color:var(--ink);
  background:var(--surface); border:1px solid var(--hair); border-radius:6px;
  padding:5px 10px; cursor:pointer; line-height:1.3;
}
.btn:hover{border-color:var(--blue); color:var(--blue)}
.btn:active{background:var(--tint)}
.zoom-val{
  font-size:12px; font-weight:600; color:var(--muted);
  min-width:52px; text-align:center; font-variant-numeric:tabular-nums;
}
.bar-sep{width:1px; height:22px; background:var(--hair)}

.readout{display:flex; gap:20px; align-items:center; font-size:11.5px; color:var(--muted)}
.readout b{color:var(--ink); font-weight:700; font-variant-numeric:tabular-nums}
.readout .warn{color:var(--magenta)}

.hint{margin-left:auto; font-size:11px; color:var(--faint)}
.hint kbd{
  font-family:var(--font); font-size:10px; font-weight:700; background:var(--shell);
  border:1px solid var(--hair); border-bottom-width:2px; border-radius:4px;
  padding:1px 5px; color:var(--muted);
}

/* ============================ VIEWPORT ============================ */
#viewport{
  position:absolute; inset:0; top:var(--chrome-h,132px);
  overflow:hidden; cursor:grab; background:var(--shell);
  background-image:radial-gradient(circle at 1px 1px, #DFE5F0 1px, transparent 0);
  background-size:28px 28px;
}
#viewport.grabbing{cursor:grabbing}
#canvas{position:absolute; top:0; left:0; transform-origin:0 0}
#edges{position:absolute; top:0; left:0; overflow:visible; pointer-events:none; z-index:1}

/* decorative brand motif, bottom-right of canvas */
.decor{
  position:absolute; pointer-events:none; opacity:.16;
  width:188px; height:auto; z-index:0;
}

/* ============================ CARDS ============================ */
.node{
  position:absolute; z-index:2; background:var(--surface);
  border-radius:14px; border:2px solid var(--accent,var(--hair));
  padding:16px 18px 18px; transition:opacity .16s ease, box-shadow .16s ease;
  box-shadow:0 1px 2px rgba(31,39,51,.05), 0 8px 24px -14px rgba(31,39,51,.28);
}
#canvas[data-focus] .node:not(.is-focus){opacity:.28}
#canvas[data-focus] .node.is-focus{box-shadow:0 2px 4px rgba(31,39,51,.07), 0 14px 34px -14px rgba(31,39,51,.4)}

.node-head{display:flex; align-items:center; gap:9px; margin-bottom:2px}
.node-dot{width:10px; height:10px; border-radius:50%; background:var(--accent); flex-shrink:0}
.node-head h2{
  font-size:15px; font-weight:800; color:var(--accent); margin:0;
  letter-spacing:-.005em; white-space:nowrap;
}
.aws-mark{height:13px; width:auto; opacity:.62; margin-left:1px}
.chip{
  margin-left:auto; font-size:10px; font-weight:700; letter-spacing:.05em;
  text-transform:uppercase; padding:3px 8px; border-radius:20px; white-space:nowrap;
}
.chip-lake{background:rgba(85,180,151,.14); color:#2F7F68}
.chip-db{background:rgba(228,128,58,.15); color:#B45F1F}
.chip-partial{background:rgba(207,44,145,.11); color:var(--magenta)}
.chip-none{background:#EEF1F6; color:var(--faint)}

.sec-label{
  font-size:9.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  color:var(--faint); margin:15px 0 8px;
}
.sec-label:first-of-type{margin-top:13px}

/* --- source system chips --- */
.sources{display:grid; grid-template-columns:1fr 1fr; gap:6px}
.src{
  display:flex; align-items:center; gap:7px; min-width:0;
  border:1px dashed var(--hair); border-radius:7px;
  padding:6px 8px; background:#FCFDFF;
}
.src.confirmed{border-style:solid; border-color:var(--hair-soft); background:var(--surface)}
.src svg{width:15px; height:15px; flex-shrink:0; color:var(--accent); opacity:.85}
.src span{
  font-size:11px; color:var(--muted); line-height:1.25;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.src.confirmed span{color:var(--ink)}

/* --- flow divider --- */
.flow{display:flex; align-items:center; gap:9px; margin:13px 0 2px}
.flow i{flex:1; height:1px; background:var(--hair-soft)}
.flow svg{width:13px; height:13px; color:var(--gray)}

/* --- 2x2 platform slots --- */
.slots{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:9px}
.slot{
  border:1px solid var(--hair-soft); border-radius:9px;
  padding:9px 10px 10px; background:#FCFDFF; min-height:86px;
}
.slot.is-empty{border-style:dashed; border-color:var(--hair); background:transparent}
.slot h3{
  font-size:9.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase;
  color:var(--faint); margin:0 0 8px;
}
.slot.is-store h3{color:var(--accent)}
.svcs{display:flex; flex-direction:column; gap:6px}
.svc{display:flex; align-items:center; gap:7px; min-width:0}
.svc img{width:20px; height:20px; border-radius:3px; flex-shrink:0}
.svc span{
  font-size:11px; font-weight:500; color:var(--ink); line-height:1.2;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.slot-empty{
  display:flex; align-items:center; gap:6px;
  font-size:10.5px; font-style:italic; color:var(--faint); line-height:1.35;
}
.slot-empty b{
  font-style:normal; font-weight:800; color:var(--gray); font-size:12px;
}

/* --- placeholder entity --- */
.node.is-placeholder{
  border-style:dashed; border-color:var(--hair); background:rgba(255,255,255,.55);
  box-shadow:none;
}
.node.is-placeholder .node-head h2{color:var(--faint)}
.node.is-placeholder .node-dot{background:var(--hair)}
.ph-body{
  border:1px dashed var(--hair); border-radius:9px; padding:14px;
  text-align:center; margin-top:12px;
}
.ph-body b{display:block; font-size:12px; font-weight:700; color:var(--faint); margin-bottom:4px}
.ph-body span{font-size:10.5px; font-style:italic; color:var(--faint); line-height:1.4}

/* ============================ HUB ============================ */
.hub{border-color:var(--blue-deep); border-width:2px}
.hub .node-head{margin-bottom:0}
.hub .node-head h2{font-size:16px; color:var(--blue-deep)}
.hub-org{
  font-size:12.5px; font-weight:700; color:var(--blue-deep);
  margin:1px 0 0 19px; letter-spacing:-.005em;
}
.hub-lede{
  font-size:11.5px; color:var(--muted); line-height:1.5; margin:12px 0 0;
  padding-bottom:14px; border-bottom:1px solid var(--hair-soft);
}
.hub-studio{
  display:flex; align-items:center; gap:10px; background:var(--tint);
  border-radius:10px; padding:11px 12px; margin-top:14px;
}
.hub-studio img{width:32px; height:32px; border-radius:4px; flex-shrink:0}
.hub-studio div{min-width:0}
.hub-studio b{display:block; font-size:12px; font-weight:700; color:var(--ink); line-height:1.25}
.hub-studio span{font-size:10px; color:var(--muted)}

.std{margin-top:14px}
.std h3{
  font-size:9.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase;
  margin:0 0 7px; color:var(--faint);
}
.std ul{list-style:none; margin:0 0 12px; padding:0; display:flex; flex-direction:column; gap:5px}
.std li{display:flex; align-items:flex-start; gap:7px; font-size:11px; line-height:1.35}
.std li svg{width:13px; height:13px; flex-shrink:0; margin-top:1px}
.std .yes svg{color:var(--teal)} .std .yes{color:var(--ink); font-weight:600}
.std .no svg{color:var(--magenta)} .std .no{color:var(--muted)}
.std-note{
  font-size:10px; font-style:italic; color:var(--faint); line-height:1.45;
  margin:0; padding-top:11px; border-top:1px solid var(--hair-soft);
}

/* ============================ EDGES ============================ */
.edge{fill:none; stroke-linecap:round; transition:opacity .16s ease}
#canvas[data-focus] .edge:not(.is-focus),
#canvas[data-focus] .edge-label:not(.is-focus){opacity:.12}
.edge-label text{
  font-family:var(--font); font-size:10.5px; font-weight:700;
  letter-spacing:.04em; text-transform:uppercase;
}
.edge-label rect{stroke-width:1}

/* ================= CANVAS FURNITURE (legend + provenance band) ================= */
.furniture{
  position:absolute; z-index:2; background:var(--surface);
  border:1px solid var(--hair); border-radius:12px; padding:15px 17px 14px;
  box-shadow:0 1px 2px rgba(31,39,51,.04), 0 8px 24px -18px rgba(31,39,51,.3);
}
.furniture h4{
  font-size:9.5px; font-weight:700; letter-spacing:.13em; text-transform:uppercase;
  color:var(--faint); margin:0 0 9px;
}
.legend h4:not(:first-child){margin-top:15px; padding-top:13px; border-top:1px solid var(--hair-soft)}
.leg-row{display:flex; align-items:center; gap:10px; margin-bottom:7px; font-size:11px; color:var(--muted)}
.leg-row:last-child{margin-bottom:0}
.leg-row svg{flex-shrink:0}

.band{display:flex; gap:26px; align-items:flex-start; padding:17px 22px 18px}
.band-lede{width:214px; flex-shrink:0; border-right:1px solid var(--hair-soft); padding-right:26px}
.band-lede h4{margin-bottom:6px}
.band-lede b{font-size:13px; font-weight:800; color:var(--blue); line-height:1.35; display:block}
.band-col{flex:1; min-width:0}
.band-col h5{
  font-size:9.5px; font-weight:700; letter-spacing:.11em; text-transform:uppercase;
  margin:0 0 5px; color:var(--magenta);
}
.band-col p{margin:0; font-size:11px; color:var(--muted); line-height:1.55}
.band-col b{color:var(--ink); font-weight:700}

@media print{
  body{overflow:visible; background:#fff}
  .bar,.hint{display:none}
  #viewport{position:static; overflow:visible; background:#fff; background-image:none}
}
</style>
</head>
<body>

<header class="head">
  <div class="head-main">
    <p class="eyebrow" id="h-org"></p>
    <h1 id="h-title"></h1>
    <div class="rule"></div>
    <p id="h-sub"></p>
  </div>
  <div class="head-side">
    <div class="state-badge">
      <b id="h-state"></b>
      <span id="h-asof"></span>
    </div>
    <img class="galaxy-logo" id="h-logo" alt="Galaxy Global">
  </div>
</header>

<div class="bar">
  <div class="zoom">
    <button class="btn" id="zo" title="Zoom out (−)">−</button>
    <span class="zoom-val" id="zv">100%</span>

    <button class="btn" id="zf" title="Fit to screen (0)">Fit</button>
    <button class="btn" id="zr" title="Reset to 100%">100%</button>
  </div>
  <div class="bar-sep"></div>
  <div class="readout">
    <span>Entities mapped <b id="r-ent"></b></span>
    <span>Source systems <b class="warn" id="r-src"></b> confirmed</span>
    <span>Hub connections <b class="warn" id="r-link"></b> confirmed</span>
  </div>
  <div class="hint">
    Drag to pan · <kbd>⌘</kbd>/<kbd>Ctrl</kbd> + scroll to zoom · <kbd>0</kbd> to fit
  </div>
</div>

<div id="viewport">
  <div id="canvas">
    <svg id="edges"></svg>
    <img class="decor" id="decor" alt="">
    <aside class="furniture legend" id="legend"></aside>
    <aside class="furniture band" id="band"></aside>
  </div>
</div>

/* ══════════════════════════════ HELPERS ══════════════════════════════ */
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ico = (d, cls='') =>
  `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor"
    stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="${d}"/></svg>`;
const svcRow = s =>
  `<div class="svc"><img src="${ASSETS[s.key]}" alt=""><span>${esc(s.label)}</span></div>`;

function slot(title, items, opts = {}) {
  const empty = !items || !items.length;
  const cls = ['slot', empty ? 'is-empty' : '', opts.store ? 'is-store' : ''].filter(Boolean).join(' ');
  const body = empty
    ? `<div class="slot-empty"><b>?</b><span>${esc(opts.emptyText || 'Not identified')}</span></div>`
    : `<div class="svcs">${items.map(svcRow).join('')}</div>`;
  return `<div class="${cls}"><h3>${esc(title)}</h3>${body}</div>`;
}

/* ══════════════════════════════ LAYOUT ══════════════════════════════ */
const nodeEl = id => canvas.querySelector(`.node[data-id="${id}"]`);
let CW = 0, CH = 0;

function layout() {
  const left  = MODEL.entities.filter(e => e.side === 'left');
  const right = MODEL.entities.filter(e => e.side === 'right');
  const colLX = L.pad;
  const colCX = L.pad + L.cardW + L.gapX;
  const colRX = colCX + L.hubW + L.gapX;
  CW = colRX + L.cardW + L.pad;

  const place = (list, x) => {
    let y = L.pad;
    list.forEach(e => {
      const el = nodeEl(e.id);
      el.style.width = L.cardW + 'px';
      el.style.left  = x + 'px';
      el.style.top   = y + 'px';
      e._box = {x, y, w:L.cardW, h:el.offsetHeight};
      y += el.offsetHeight + L.gapY;
    });
    return y - L.gapY;
  };

  const hL = place(left, colLX), hR = place(right, colRX);
  const contentBottom = Math.max(hL, hR);

  const hub = nodeEl('hub');
  hub.style.width = L.hubW + 'px';
  hub.style.left  = colCX + 'px';
  const hubH = hub.offsetHeight;
  const hubY = Math.max(L.pad, L.pad + (contentBottom - L.pad - hubH) / 2);
  hub.style.top = hubY + 'px';
  MODEL.hub._box = {x:colCX, y:hubY, w:L.hubW, h:hubH};

  // legend sits in the centre column, directly under the hub
  const leg = document.getElementById('legend');
  leg.style.width = L.hubW + 'px';
  leg.style.left  = colCX + 'px';
  leg.style.top   = (hubY + hubH + L.gapY) + 'px';
  const legBottom = hubY + hubH + L.gapY + leg.offsetHeight;

  // provenance band spans the full canvas width, below everything
  const band = document.getElementById('band');
  band.style.width = (CW - L.pad * 2) + 'px';
  band.style.left  = L.pad + 'px';
  const bandY = Math.max(contentBottom, legBottom) + L.gapY;
  band.style.top = bandY + 'px';

  CH = bandY + band.offsetHeight + L.tail;
  canvas.style.width  = CW + 'px';
  canvas.style.height = CH + 'px';
  edges.setAttribute('width', CW);
  edges.setAttribute('height', CH);
  edges.setAttribute('viewBox', `0 0 ${CW} ${CH}`);

  const decor = document.getElementById('decor');
  decor.style.left = (CW - 254) + 'px';
  decor.style.top  = (bandY + band.offsetHeight - 36) + 'px';
}

/* ══════════════════════════════ EDGES ══════════════════════════════ */
const SVGNS = 'http://www.w3.org/2000/svg';
const mk = (t, a) => { const n = document.createElementNS(SVGNS, t);
  for (const k in a) n.setAttribute(k, a[k]); return n; };

function drawEdges() {
  edges.textContent = '';
  const defs = mk('defs', {});
  edges.appendChild(defs);

  const hub = MODEL.hub._box;
  const drawn = MODEL.entities.filter(e => e._box);

  ['left','right'].forEach(side => {
    const list = drawn.filter(e => e.side === side);
    list.forEach((e, i) => {
      const st = e.placeholder
        ? {dash:'3 8', width:1.5, color:'#C9D1DE', label:null}
        : LINK_STYLE[e.link.status];
      const color = st.color || e.accent;

      // anchor points: card's hub-facing edge → hub's facing edge, fanned out
      const b = e._box;
      const x1 = side === 'left' ? b.x + b.w : b.x;
      const y1 = b.y + b.h / 2;
      const span = hub.h * 0.62;
      const y2 = hub.y + hub.h / 2 - span / 2 + (list.length > 1 ? span * i / (list.length - 1) : span / 2);
      const x2 = side === 'left' ? hub.x : hub.x + hub.w;

      const dx = (x2 - x1) * 0.5;
      const d = `M ${x1} ${y1} C ${x1 + dx} ${y1}, ${x2 - dx} ${y2}, ${x2} ${y2}`;

      const mid = `arw-${e.id}`;
      const m = mk('marker', {id:mid, viewBox:'0 0 10 10', refX:'8.5', refY:'5',
        markerWidth:'6', markerHeight:'6', orient:'auto-start-reverse'});
      m.appendChild(mk('path', {d:'M0,1 L9,5 L0,9 z', fill:color}));
      defs.appendChild(m);

      const p = mk('path', {d, class:'edge', stroke:color,
        'stroke-width':st.width, 'marker-end':`url(#${mid})`,
        'data-id':e.id, opacity: e.placeholder ? .5 : .9});
      if (st.dash) p.setAttribute('stroke-dasharray', st.dash);
      edges.appendChild(p);

      if (!st.label && !e.link) return;
      const text = e.placeholder ? null : (e.link.label || st.label);
      if (!text) return;

      const pt = p.getPointAtLength(p.getTotalLength() * 0.5);
      const g = mk('g', {class:'edge-label', 'data-id':e.id});
      const t = mk('text', {x:pt.x, y:pt.y + 3.6, 'text-anchor':'middle', fill:color});
      t.textContent = text;
      g.appendChild(t);
      edges.appendChild(g);
      const bb = t.getBBox();
      const r = mk('rect', {x:bb.x - 8, y:bb.y - 4, width:bb.width + 16, height:bb.height + 8,
        rx:9, fill:'#fff', stroke:color, 'stroke-opacity':.35});
      g.insertBefore(r, t);
    });
  });
}

/* ══════════════════════════════ READOUT ══════════════════════════════ */
function readout() {
  const real = MODEL.entities.filter(e => !e.placeholder);
  const src  = real.flatMap(e => e.sources);
  const ok   = src.filter(s => s.confirmed).length;
  const lk   = real.filter(e => e.link.status !== 'unknown').length;
  document.getElementById('r-ent').textContent  = `${real.length} of ${MODEL.entities.length}`;
  document.getElementById('r-src').textContent  = `${ok} / ${src.length}`;
  document.getElementById('r-link').textContent = `${lk} / ${real.length}`;
}

/* ══════════════════════════════ FOCUS ══════════════════════════════ */
function focusWiring() {
  canvas.querySelectorAll('.node').forEach(n => {
    const id = n.dataset.id;
    if (id === 'hub') return;
    n.addEventListener('mouseenter', () => {
      canvas.dataset.focus = id;
      n.classList.add('is-focus');
      nodeEl('hub').classList.add('is-focus');
      edges.querySelectorAll(`[data-id="${id}"]`).forEach(x => x.classList.add('is-focus'));
    });
    n.addEventListener('mouseleave', () => {
      delete canvas.dataset.focus;
      canvas.querySelectorAll('.is-focus').forEach(x => x.classList.remove('is-focus'));
      edges.querySelectorAll('.is-focus').forEach(x => x.classList.remove('is-focus'));
    });
  });
}

/* ══════════════════════════════ PAN / ZOOM ══════════════════════════════ */
const vp = document.getElementById('viewport');
let scale = 1, tx = 0, ty = 0;

function apply() {
  canvas.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
  document.getElementById('zv').textContent = Math.round(scale * 100) + '%';
}
function zoomAt(cx, cy, next) {
  const s = Math.min(2.5, Math.max(0.15, next));
  tx = cx - (cx - tx) * (s / scale);
  ty = cy - (cy - ty) * (s / scale);
  scale = s; apply();
}
function fit() {
  const r = vp.getBoundingClientRect();
  scale = Math.min((r.width - 48) / CW, (r.height - 48) / CH);
  tx = (r.width  - CW * scale) / 2;
  ty = (r.height - CH * scale) / 2;
  apply();
}
function reset() {
  const r = vp.getBoundingClientRect();
  scale = 1; tx = (r.width - CW) / 2; ty = 24; apply();
}

let drag = null;
vp.addEventListener('mousedown', e => {
  drag = {x:e.clientX - tx, y:e.clientY - ty};
  vp.classList.add('grabbing');
});
window.addEventListener('mousemove', e => {
  if (!drag) return;
  tx = e.clientX - drag.x; ty = e.clientY - drag.y; apply();
});
window.addEventListener('mouseup', () => { drag = null; vp.classList.remove('grabbing'); });

vp.addEventListener('wheel', e => {
  const r = vp.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) {
    e.preventDefault();
    zoomAt(e.clientX - r.left, e.clientY - r.top, scale * (e.deltaY > 0 ? 0.92 : 1.08));
  } else {
    e.preventDefault();
    tx -= e.deltaX; ty -= e.deltaY; apply();
  }
}, {passive:false});

document.getElementById('zi').onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, scale * 1.18); };
document.getElementById('zo').onclick = () => { const r = vp.getBoundingClientRect(); zoomAt(r.width/2, r.height/2, scale / 1.18); };
document.getElementById('zf').onclick = fit;
document.getElementById('zr').onclick = reset;

window.addEventListener('keydown', e => {
  if (e.target.matches('input,textarea')) return;
  if (e.key === '0') fit();
  else if (e.key === '+' || e.key === '=') document.getElementById('zi').click();
  else if (e.key === '-') document.getElementById('zo').click();
});

function chromeHeight() {
  const h = document.querySelector('.head').offsetHeight + document.querySelector('.bar').offsetHeight;
  document.documentElement.style.setProperty('--chrome-h', h + 'px');
}

/* ══════════════════════════════ BOOT ══════════════════════════════ */
function boot() {
  chromeHeight();
  legend();          // must precede layout() — layout measures the legend's height
  readout();
  layout();
  drawEdges();
  focusWiring();
  fit();
}
boot();
document.fonts && document.fonts.ready.then(() => { chromeHeight(); layout(); drawEdges(); fit(); });
window.addEventListener('resize', () => { chromeHeight(); fit(); });
</script>
